; Runtime camera HAL configuration (chip + product).
; Deployed to /etc/config/hal_camera_config.ini

[camera]
; Total number of camera devices
number = 1
; 1: create VPSS channels on first stream enable (faster camera preview entry)
; 0: create all channels at configure_streams (legacy)
lazy_channel_create = 1

[camera0]
; 0:EVP,1:MIPI_1,2:MIPI_2,3:MULTI_DVP,4:MULTI_MIPI_1,5:MULTI_MIPI_2
; AV200 4-lane OV8856 keeps VI_INTF_MIPI_2; data-lane count is sensor MIPI_LANES=4
interface_mode = 2
; Max FPS of sensor
max_fps        = 20
; mirror / flip hardware settings
mirror         = 1
flip           = 0
; Software IPU rotation (degrees). Sensor mount is upright on this board —
; keep 0 (no IPU rotate). 90/270 would swap W/H; pair with fw_video_config crops.
rotation       = 0

; VPSS tuning binary: vega board conf isp_ov8856_7.100.25042408.conf, installed under the 4lane name (pu8IspCfgPath, not isp.ini)
isp_config_path = /etc/config/isp_ov8856_mipi_4lane_av200.conf


; =========================
; IPU configuration
; =========================
[ipu]
que_id     = 1
module_id  = 0xCC

; =========================
; Auto focus (opt-in; other products omit this section)
; =========================
[af]
enable = 1
mode = kernel
vcm_type = fp5510
focus_pos_min = 0
focus_pos_max = 64
af_settle_ms = 20

; =========================
; AI detect ↔ sub-type map
; =========================
[ai_detect_sub0]
detect_type = CAMERA_AI_DETECT_GESTURE
sub_type    = CAMERA_AI_DETECT_CLASSIFY_GESTURE

[ai_detect_sub1]
detect_type = CAMERA_AI_DETECT_HUMAN_FACE
sub_type    = CAMERA_AI_RECOGNIZE_HUMAN_FACE|CAMERA_AI_DETECT_CLASSIFY_ANTI_SPOOFING_FACE

[ai_detect_sub2]
detect_type = CAMERA_AI_DETECT_UPPER_BODY
sub_type    = CAMERA_AI_RECOGNIZE_UPPER_BODY


; =========================
; AI model configurations
; =========================

; model 0: upper body + human face
[ai_model0]
model_path   = /mnt/install/model/model_0x0A000016_V1.00.03
width        = 640
height       = 384
model_type   = AK_SVP_MODEL_DETECT
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 2
label0       = CAMERA_AI_DETECT_UPPER_BODY
label1       = CAMERA_AI_DETECT_HUMAN_FACE

