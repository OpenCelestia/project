## params for effect

[def_ssl]
frameSize=256
soundSpeed=343
sourcesNumbers=1
.importSection=two_array_geometry

[volctl_1]
volume=2dB
volSmoothTime=300

[res_1]
maxinputlen=256
outSampleRate=32000
reSampleArithmetic=0
outChannel=1

[res_2]
maxinputlen=256
outSampleRate=32000
reSampleArithmetic=1
outChannel=1

[pcmbuf_1]
InputSampleRate=8000
OutputSampleRate=8012
bufSize=4096
frameSize=32 

[eq_1]
eqmode=user
preGain=-1.0dB
bands="2, lsf 1200 -12dB 0.9 enable, hpf 800 0 0.8 enable"

[aslc_1]
aslcEna=1
aslcLimitLevel=27600
aslcStartLevel=0.5FS
jointChannels=2
maxLenin=0
aslcPreset=limiter  # limiter (default) or noise_gate
vol_dB=6dB

[aslc_2]
aslcEna=1
jointChannels=2
lookAheadTime=6ms
gainAttackTime=3ms
gainReleaseTime=3ms
aslcPreset=noise_gate  # limiter (default) or noise_gate
milestone="5, 0 0, -50dB -60dB, -40dB -40dB, -3dB -3dB, 0dB -3dB"
vol_dB=4dB

[vad_1]
