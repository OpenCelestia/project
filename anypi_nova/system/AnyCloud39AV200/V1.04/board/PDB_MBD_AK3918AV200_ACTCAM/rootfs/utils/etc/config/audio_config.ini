## params for AI
[def_near]
; EQ
eqLoad=1
eqmode=user
preGain=0dB
bands="0"

; AEC
aecEna=1
aecLoad=1
tail=512
farDigiGain=1.0
nearDigiGain=1.0
farLimit=0.15FS
farBreakdownThresh=0

; NR
nrEna=1
noiseSuppressDb=-40

; AGC
agcEna=1
agcLevel=0.25FS
maxGain=4
minGain=0.1
nearSensitivity=60

; VOLUME
volLoad=1
limit=1.0FS
vol_dB=0dB
gain=33
mute=0
echoMode=normal

; ASLC: set to 0 to avoid SDK ASLC buffer alloc with wrong size (e.g. -444267776) causing record crash
aslcEna=0

; hsLoad must be 1 even when hsEna=0: otherwise VQE HsDisable hits "module doesn't login"
;hs
hsLoad=1
hsEna=0
hsAlgorithm=2
hsDurationMs=5000
;ptprThr=11
;phprThr=26
;pnprThr=15

; AIDenoise
;aidenoiseEna=1
;modelName="model_aidenoise"

echo_DebugZones="default"

; Volc live mic (NORMAL / PTT uplink). Talk still uses [def_near].
; Exp8: Exp7 NR=-20 still ate unstressed syllables
; ("你好小凯"→"你好，小！" / "你看到了什么"→"你看什么？") and AGC maxGain=4
; pumped pcm_peak between 8 and ~28000. PTT masks AEC, so NR is not
; fighting echo here — turn it off and keep a milder AGC for level.
[volc_mic]
eqLoad=1
eqmode=user
preGain=0dB
bands="0"
aecEna=1
aecLoad=1
tail=512
farDigiGain=1.0
nearDigiGain=1.0
farLimit=1.0FS
farBreakdownThresh=0
nrEna=0
noiseSuppressDb=-20
agcEna=1
agcLevel=0.30FS
maxGain=2
minGain=0.5
nearSensitivity=60
volLoad=1
limit=1.0FS
vol_dB=0dB
gain=33
mute=0
echoMode=normal
aslcEna=0
hsLoad=1
hsEna=0
hsAlgorithm=2
hsDurationMs=5000
echo_DebugZones="default"

## params for AO
[def_far]
eqLoad=1
eqmode=user
preGain=0dB
bands="0"
nrEna=0
noiseSuppressDb=-20
volLoad=1
; Exp7: SPK too quiet at limit=0.15/vol_dB=4. Raise ceiling + digital gain.
; PTT mutes downlink while speaking so barge risk is lower.
limit=0.40FS
vol_dB=8dB
; AV200 DAC analog gain [-24,0]; 0=loudest. gain= in this section is also applied by LoadConf.
gain=0
mute=0
echoMode=normal

;hs
hsLoad=1
hsEna=0
hsAlgorithm=2
hsDurationMs=5000
;ptprThr=11
;phprThr=26
;pnprThr=15

[two_array_geometry]
arrayGeometry="2, 0.03 0 0, -0.03 0 0"

[four_array_geometry]
arrayGeometry="4, 0.015 0 0, -0.015 0 0, 0 0.015 0, 0 -0.015 0"

