 a_uboot_flags 0x1
 kernel_offset 0x52000
 kernel_size 0x380000
 dtb_offset 0x42000
 dtb_size 0x10000
 dtb_addr 0x41100000
 fdt_high 0xFFFFFFFFFFFFFFFF
 loadaddr 0x411FFFC0
 image_name uImage
 update_offset 0x0
 update_size 0x0
 update tftp $(loadaddr) $(image_name); sf probe ; sf update $(loadaddr) $(update_offset) $(filesize)
 ethaddr 00:55:7b:b5:7d:f7
 eth1addr 00:55:7b:b5:7d:f7
 ipaddr 192.168.1.99
 serverip 192.168.1.1
 netmask 255.255.255.0
 baudrate 115200
 console ttySAK0,115200n8
 rdinit /sbin/init
 mem mem=256M
 memsize memsize=256M
 mtdparts mtdparts=spi0.0:128K@0x0(SPL),128K@0x20000(OPENSBI),4K@0x40000(ENV),4K@0x41000(ENVBK),64K@0x42000(DTB),3584K@0x52000(KERNEL),3072K@0x3D2000(ROOTFS),512K@0x6D2000(CONFIG),8880K@0x752000(APP)
 read_kernel sf probe;sf read ${loadaddr} ${kernel_offset} ${kernel_size}
 read_dtb sf probe;sf read ${dtb_addr} ${dtb_offset} ${dtb_size}
 bootargs console=${console} rdinit=${rdinit} mem=${mem}
 setcmd setenv bootargs console=${console} rdinit=${rdinit} mem=${mem}
 boot_normal env set bootargs console=${console} root=/dev/mtdblock6 rootfstype=squashfs init=${rdinit} ${mtdparts} ${mem};run read_dtb;run read_kernel;bootm ${loadaddr} - ${dtb_addr}
 bootcmd run boot_normal
 env_platform anycloud_ak3918av200
