 a_uboot_flags 0x1
 kernel_offset 0xa7000
 kernel_size 0x300000
 dtb_offset 0x97000
 dtb_size 0x10000
 dtb_addr 0x41100000
 fdt_high 0xFFFFFFFFFFFFFFFF
 loadaddr 0x411FFFC0
 image_name uImage
 update_offset 0x0
 update_size 0x0
 update tftp $(loadaddr) $(image_name); sf probe ; sf update $(loadaddr) $(update_offset) $(filesize)
 ethaddr 00:55:7b:b5:7d:f7
 eth1addr 00:55:7b:b5:7d:f7
 ipaddr 192.168.1.99
 serverip 192.168.1.1
 netmask 255.255.255.0
 baudrate 115200
 console ttySAK0,115200n8
 rdinit /sbin/init
 mem mem=256M
 memsize memsize=256M
 mtdparts mtdparts=spi0.0:596K@0x0(UBOOT),4K@0x95000(ENV),4K@0x96000(ENVBAK),64K@0x97000(DTB),3072K@0xa7000(KERNEL),300K@0x3a7000(LOGO),4096K@0x3f2000(ROOTFS),1024K@0x7f2000(CONFIG),23608K@0x8f2000(APP)
 read_kernel sf probe;sf read ${loadaddr} ${kernel_offset} ${kernel_size}
 read_dtb sf probe;sf read ${dtb_addr} ${dtb_offset} ${dtb_size}
 bootargs console=${console} rdinit=${rdinit} mem=${mem} 
 setcmd setenv bootargs console=${console} rdinit=${rdinit} mem=${mem}
 boot_normal env set bootargs console=${console} root=/dev/mtdblock6  rootfstype=squashfs rdinit=${rdinit} ${mtdparts} ${mem};run read_dtb;run read_kernel;bootm ${loadaddr} - ${dtb_addr}
 bootcmd run boot_normal
 env_platform anycloud_ak3918av200

 
 
 
