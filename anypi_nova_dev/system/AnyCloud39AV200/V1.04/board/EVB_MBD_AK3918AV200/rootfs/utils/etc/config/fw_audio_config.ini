; ------------------------------------------------------------------------------
; Framework multimedia stream params (audio_config_load / Stella).
; Same keys as legacy audio_cfg.ini; coexists with AK MPI LoadConf sections below.
; code_type: 6=PCM, 17=G711A, 18=G711U, 4=AAC, 2=MP3 (see multimedia.h).
; stream_in_cnt must match the number of [audio_inN] sections in use.
; ------------------------------------------------------------------------------
[main]
stream_in_cnt = 1
audio_out_cnt = 1

[audio_in0]
enable      = 1
code_type   = 17
channel_num = 1
sample_bits = 16
sample_rate = 16000
cirbuf_size = 64000

[audio_in1]
enable      = 1
code_type   = 17
channel_num = 1
sample_bits = 16
sample_rate = 16000
cirbuf_size = 64000

[audio_out0]
enable      = 1
code_type   = 6
channel_num = 1
sample_bits = 16
sample_rate = 16000
