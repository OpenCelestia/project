; Runtime camera HAL configuration (chip + product).
; Deployed to /etc/config/hal_camera_config.ini

[camera]
; Total number of camera devices
number = 1

[camera0]
; 0:EVP,1:MIPI_1,2:MIPI_2,3:MULTI_DVP,4:MULTI_MIPI_1,5:MULTI_MIPI_2
interface_mode = 2
; Max FPS of sensor
max_fps        = 30
; mirror / flip hardware settings
mirror         = 1
flip           = 0

; ISP configuration file path for this camera
isp_config_path = /etc/config/isp_gc5603_mipi_2lane_av200.conf


; =========================
; IPU configuration
; =========================
[ipu]
que_id     = 1
module_id  = 0xCC


; =========================
; AI detect ↔ sub-type map
; =========================
[ai_detect_sub0]
detect_type = CAMERA_AI_DETECT_GESTURE
sub_type    = CAMERA_AI_DETECT_CLASSIFY_GESTURE

[ai_detect_sub1]
detect_type = CAMERA_AI_DETECT_HUMAN_FACE
sub_type    = CAMERA_AI_RECOGNIZE_HUMAN_FACE|CAMERA_AI_DETECT_CLASSIFY_ANTI_SPOOFING_FACE

[ai_detect_sub2]
detect_type = CAMERA_AI_DETECT_UPPER_BODY
sub_type    = CAMERA_AI_RECOGNIZE_UPPER_BODY


; =========================
; AI model configurations
; =========================

; model 0: upper body + human face
[ai_model0]
model_path   = /usr/model/model_0x0A000016_V1.00.03
width        = 640
height       = 384
model_type   = AK_SVP_MODEL_DETECT
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 2
label0       = CAMERA_AI_DETECT_UPPER_BODY
label1       = CAMERA_AI_DETECT_HUMAN_FACE

; model 1: gesture detect
[ai_model1]
model_path   = /usr/model/model_0x0A000007_V2.00.02
width        = 640
height       = 384
model_type   = AK_SVP_MODEL_DETECT
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 1
label0       = CAMERA_AI_DETECT_GESTURE

; model 2: pet detect
[ai_model2]
model_path   = /usr/model/model_0x0A00000E_V1.00.00
width        = 640
height       = 384
model_type   = AK_SVP_MODEL_DETECT
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 2
label0       = CAMERA_AI_DETECT_PET
label1       = CAMERA_AI_NONE

; model 3: human/vehicle/non-motor detection
[ai_model3]
model_path   = /usr/model/model_0x0A000012_V1.00.03
width        = 640
height       = 384
model_type   = AK_SVP_MODEL_DETECT
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 6
label0       = CAMERA_AI_DETECT_HUMAN_SHAPE
label1       = CAMERA_AI_DETECT_VEHICLE|CAMERA_AI_DETECT_VEHICLE_CAR
label2       = CAMERA_AI_DETECT_VEHICLE|CAMERA_AI_DETECT_VEHICLE_TRUCK
label3       = CAMERA_AI_DETECT_VEHICLE|CAMERA_AI_DETECT_VEHICLE_BUS
label4       = CAMERA_AI_DETECT_NON_MOTOR_VEHICLE
label5       = CAMERA_AI_DETECT_NON_MOTOR_VEHICLE|CAMERA_AI_DETECT_NON_MOTOR_VEHICLE_TRICYCLE

; model 4: face recognition
[ai_model4]
model_path   = /usr/model/model_0x0A020003_V1.00.00
width        = 112
height       = 112
model_type   = AK_SVP_MODEL_0X0A020003
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 1
label0       = CAMERA_AI_RECOGNIZE_HUMAN_FACE

; model 5: gesture classify
[ai_model5]
model_path   = /usr/model/model_0x0A010004_V1.01.01
width        = 64
height       = 64
model_type   = AK_SVP_MODEL_0X0A010004
img_type     = AK_SVP_IMG_RGB_HWC
label_count  = 7
label0       = CAMERA_AI_NONE
label1       = CAMERA_AI_NONE
label2       = CAMERA_AI_DETECT_CLASSIFY_GESTURE|CAMERA_AI_DETECT_GESTURE_OK
label3       = CAMERA_AI_DETECT_CLASSIFY_GESTURE|CAMERA_AI_DETECT_GESTURE_SIX
label4       = CAMERA_AI_DETECT_CLASSIFY_GESTURE|CAMERA_AI_DETECT_GESTURE_STOP
label5       = CAMERA_AI_DETECT_CLASSIFY_GESTURE|CAMERA_AI_DETECT_GESTURE_THUMB_UP
label6       = CAMERA_AI_DETECT_CLASSIFY_GESTURE|CAMERA_AI_DETECT_GESTURE_TWO

