[volc]
app_id = YOUR_RTC_APP_ID
room_id = YOUR_ROOM_ID
user_id = YOUR_USER_ID
# RTC join token is issued at runtime. Inject ${VOLC_RTC_TOKEN}; do not commit a real token.
token = ${VOLC_RTC_TOKEN}
end_point_id = YOUR_ENDPOINT_ID

task_id = YOUR_TASK_ID
# AK/SK are injected at runtime. Do not commit real values.
sk = ${VOLC_SK}
ak = ${VOLC_AK}

rtc_app_id = YOUR_RTC_APP_ID
rtc_app_key = ${VOLC_RTC_APP_KEY}

default_end_point_id = YOUR_ENDPOINT_ID
default_voice_type = YOUR_VOICE_TYPE

asr_app_id = YOUR_ASR_APP_ID
asr_access_token = ${VOLC_ASR_TOKEN}

tts_app_id = YOUR_TTS_APP_ID
tts_access_token = ${VOLC_TTS_TOKEN}

account_id = YOUR_ACCOUNT_ID

duplex_mode = full
enable_vad_interrupt = 1
asr_silence_time_ms = 800
vision_enable = 1
