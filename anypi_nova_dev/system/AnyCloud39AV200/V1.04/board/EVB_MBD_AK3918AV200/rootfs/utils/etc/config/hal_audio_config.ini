; Runtime audio HAL configuration
; Deployed to /etc/config/hal_audio_config.ini

[ai]
; AI (audio input) filter print level (SDK-defined)
print_level      = 0
; Input gain (dB)
gain             = 30
; Driver buffer periods (8~80)
drv_buf_periods  = 16
; Thread priority (1~99)
thread_priority  = 50

[ao]
; AO (audio output) gain (dB)
gain             = -20
; Driver buffer periods (8~80)
drv_buf_periods  = 8
; Thread priority (1~99)
thread_priority  = 50

[loopback]
; Loopback driver buffer periods (8~80)
drv_buf_periods  = 16
; Loopback thread priority (1~99)
thread_priority  = 80

[timeout]
; AK_MPI_* send frame timeout in milliseconds
send_frame_ms    = 1000
; AK_MPI_* receive frame timeout in milliseconds
receive_frame_ms = 1000

[save]
; PCM save/dump path and file names, and frame length
pcm_path        = /tmp/
input_name      = dump_in
output_name     = dump_out
input_second    = 180
output_second   = 180
send_frame_len  = 1280

[effect]
; Sections used by AK_MPI_AI/AO_LoadConf
in_normal_section   = def_near
echo_section        = def_near
out_normal_section  = def_far

in_dmic_section     = two_array_near
in_vad_section      = config_effect_default_near
in_cpu_cry_section  = config_effect_default_near
in_npu_cry_section  = config_effect_default_near
in_lssl_section     = config_effect_lssl_near

; Sections used by AUDIO_EFFECT_* (optional override, keep default if empty)
npu_cry_section     = ai_cry_1
cpu_cry_section     = cry_1
vad_section         = vad_1
lssl_section        = def_lssl
resample_section    = res_1

[mic]
; Mic hardware selection (optional, recommended keep auto)
; type: 0=auto (DTB detect), 1=AMIC(ADC), 2=DMIC(PDM)
type             = 0
; mic count (optional): 0=auto (from DTB mic-info popcount), otherwise force
num              = 0

