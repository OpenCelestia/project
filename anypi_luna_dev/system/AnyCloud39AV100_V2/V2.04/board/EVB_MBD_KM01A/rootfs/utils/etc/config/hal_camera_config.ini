; Runtime camera HAL for EVB_MBD_KM01A (anypi_luna_dev).
; Align with board config.mk CONFIG_SENSOR_NAME=gc4053 / app.sh SENSOR_SH=gc4053.sh.

[camera]
number = 1

[camera0]
interface_mode = 2
; gc4053 2-lane MIPI
max_fps        = 25
mirror         = 0
flip           = 0
isp_config_path = /etc/isp_gc4053_mipi_2lane_km01a.conf

[ipu]
que_id     = 0
module_id  = 0xCC

; =========================
; AI model (SVP2, 480x288 pet + human shape)
; =========================
[ai_model0]
model_path          = /usr/model/model_0x0A000027_V1.00.00_01.bin
width               = 480
height              = 288
model_type          = 41
data_type           = 4
img_type            = AK_SVP_IMG_RGB_LI
classify_threshold  = 600
iou_threshold       = 3
target_type         = 0
label_count         = 2
label0              = CAMERA_AI_DETECT_PET
label1              = CAMERA_AI_DETECT_HUMAN_SHAPE
