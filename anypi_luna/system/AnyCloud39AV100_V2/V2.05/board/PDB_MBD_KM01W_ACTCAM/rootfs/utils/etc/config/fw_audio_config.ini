; ------------------------------------------------------------------------------
; Framework multimedia stream params (audio_config_load).
; KM01W: sample rate aligned with legacy av.ini [Audio0] (8 kHz mono).
; code_type: 6=PCM, 17=G711A, 18=G711U, 4=AAC, 2=MP3 (see multimedia.h).
; ------------------------------------------------------------------------------
[main]
stream_in_cnt = 1
audio_out_cnt = 1

[audio_in0]
enable      = 1
code_type   = 17
channel_num = 1
sample_bits = 16
sample_rate = 8000
cirbuf_size = 32000

[audio_out0]
enable      = 1
code_type   = 6
channel_num = 1
sample_bits = 16
sample_rate = 8000
