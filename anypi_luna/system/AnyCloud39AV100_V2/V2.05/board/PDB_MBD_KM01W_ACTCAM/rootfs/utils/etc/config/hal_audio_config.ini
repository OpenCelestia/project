; Runtime audio HAL configuration
; Deployed to /etc/config/hal_audio_config.ini
; (board rootfs/utils/etc/config -> build_rootfs process_utils -> rootfs/etc/config)

[ai]
; AI filter print level (ak_atclib_print_level bitmask, see ak_common_audio.h)
; 0 = errors only; 65536 (0x10000) = HAL built-in default
print_level      = 65536
; Input gain for ak_ai_set_gain: AV100 MIC range [0, 8] (ak_ai_sample uses 5)
gain             = 5
; Driver buffer periods (8~80)
drv_buf_periods  = 16
; Thread priority (1~99)
thread_priority  = 50

[ao]
; Output gain for ak_ao_set_gain: 0 mutes DAC on AV100; 6 matches ak_ao_sample
gain             = 6
; Driver buffer periods (8~80)
drv_buf_periods  = 8
; Thread priority (1~99)
thread_priority  = 50

[loopback]
; Loopback driver buffer periods (8~80)
drv_buf_periods  = 16
; Loopback thread priority (1~99)
thread_priority  = 80

[timeout]
; ak_ai_get_frame / ak_adec_send_stream timeout (ms)
send_frame_ms    = 1000
; 0 = non-blocking poll like ak_ai_sample (ak_ai_get_frame block=0)
receive_frame_ms = 0

[save]
; PCM save/dump path and file names
pcm_path        = /tmp/sd
input_name      = dump_in
output_name     = dump_out
input_second    = 180
output_second   = 180
send_frame_len  = 1280

[effect]
; Sections for optional AK_MPI_AI/AO_LoadConf (audio_config.ini)
; AV100_V2 stock build uses audio_effect stubs unless effect lib is linked
in_normal_section   = def_near
echo_section        = def_near
out_normal_section  = def_far

in_dmic_section     = two_array_near
in_vad_section      = config_effect_default_near
in_cpu_cry_section  = config_effect_default_near
in_npu_cry_section  = config_effect_default_near
in_lssl_section     = config_effect_lssl_near

npu_cry_section     = ai_cry_1
cpu_cry_section     = cry_1
vad_section         = vad_1
lssl_section        = def_lssl
resample_section    = res_1

[mic]
; 0=auto (DTB adc_dac), 1=AMIC(ADC), 2=DMIC(PDM)
type             = 0
; 0=auto (DTB mic-info), otherwise force mic count
num              = 0
