; Runtime camera HAL tuning for AnyCloud39AV100_V2 (KM01W ACTCAM).
; Deployed to /etc/config/hal_camera_config.ini (board rootfs/utils -> build_rootfs process_utils).
;
; VI / ISP: PDK platform/sample/vi/ak_vi_sample.c
; AI / SVP2: PDK platform/sample/svp2/ak_svp2_sample.c + ak_svp2.h (SVP2 model_type names).
; Model binary (patch overlay): utils/usr/model/model_0x0A000027_V1.00.00_01.bin -> /usr/model/...

[camera]
number = 1

[camera0]
interface_mode = 2
; OS05A20 2-lane MIPI @ crop 2560x1920; dev_attr.frame_rate must match sensor/ISP fps.
max_fps        = 25
mirror         = 1
flip           = 0
isp_config_path = /etc/isp_os05a20_mipi_2lane_km01a_20fps.conf

[ipu]
que_id     = 0
module_id  = 0xCC

; =========================
; AI model (SVP2, 480x288 pet + human shape)
; =========================
; model_type: AK_SVP2_MODEL_E integer from ak_svp2.h (41 = AK_SVP2_MODEL_0X0A000027)
; data_type 4   = VI_DATA_TYPE_RGB_LINEINTL -> AK_SVP_IMG_RGB_LI (match AI VI channel / sample -d 1)
; target_type 0 = AK_SVP2_HUMAN_SHAPE (ak_svp2_sample hd_param; tune per product)

[ai_model0]
model_path          = /usr/model/model_0x0A000027_V1.00.00_01.bin
width               = 480
height              = 288
model_type          = 41
data_type           = 4
img_type            = AK_SVP_IMG_RGB_LI
classify_threshold  = 600
iou_threshold       = 3
target_type         = 0
label_count         = 2
label0              = CAMERA_AI_DETECT_PET
label1              = CAMERA_AI_DETECT_HUMAN_SHAPE
