; Mira AV130 single sc1346 — /etc/config/hal_camera_config.ini (config.lfs)
; Video encode layout: fw_video_config.json. WiFi: settings.json wifi{}.

[camera]
number = 1

[camera0]
interface_mode = 1
max_fps        = 25
mirror         = 1
flip           = 1
isp_config_path = /etc/config/isp_sc1346_mipi_1lane_av130.conf

[ipu]
que_id     = 0
module_id  = 0xCC
