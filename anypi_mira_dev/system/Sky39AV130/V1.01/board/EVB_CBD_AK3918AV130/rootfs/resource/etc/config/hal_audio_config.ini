; Mira AV130 — deployed to /etc/config/hal_audio_config.ini (config.lfs)

[ai]
print_level      = 0
gain             = 5
drv_buf_periods  = 16
thread_priority  = 50

[ao]
gain             = 6
drv_buf_periods  = 8
thread_priority  = 50

[loopback]
drv_buf_periods  = 16
thread_priority  = 80

[timeout]
send_frame_ms    = 1000
receive_frame_ms = 0

[save]
pcm_path        = /tmp
input_name      = dump_in
output_name     = dump_out
input_second    = 180
output_second   = 180
send_frame_len  = 1280

[effect]
in_normal_section   = def_near
echo_section        = talk_near
out_normal_section  = def_far
in_dmic_section     = two_array_near
in_vad_section      = config_effect_default_near
in_cpu_cry_section  = config_effect_default_near
in_npu_cry_section  = config_effect_default_near
in_lssl_section     = config_effect_lssl_near
npu_cry_section     = ai_cry_1
cpu_cry_section     = cry_1
vad_section         = vad_1
lssl_section        = def_lssl
resample_section    = res_1

[vqe]
; AV130: do not LoadConf/AEC on CALL. ak_ai_start_capture re-parses aecEna
; inside libakaudiofilter and Data-Aborts on the Nebula net_protocol thread.
call_skip_vqe   = 1
defer_ctrl      = 0
drain_close_ms  = 120

[mic]
type             = 0
num              = 0
